<nav class="navbar" aria-label="Main">
  <a class="navbar__brand" routerLink="/" (click)="closeMenu()">EShop</a>

  <button
    type="button"
    class="navbar__toggle"
    aria-controls="navbar-menu"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Toggle navigation"
    (click)="toggleMenu()"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path
        d="M3 6h18M3 12h18M3 18h18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </button>

  <div id="navbar-menu" class="navbar__menu" [class.navbar__menu--open]="menuOpen()">
    <ul class="navbar__links">
      @for (link of links; track link.path) {
        <li>
          <a
            class="navbar__link"
            [routerLink]="link.path"
            routerLinkActive="navbar__link--active"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <form class="navbar__search" role="search" (submit)="search($event, searchInput.value)">
      <input
        #searchInput
        type="search"
        name="q"
        placeholder="Search products…"
        aria-label="Search products"
      />
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </form>
  </div>

  <a
    class="navbar__cart"
    routerLink="/cart"
    [attr.aria-label]="'Cart, ' + cart.count() + ' items'"
    (click)="closeMenu()"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path
        d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="9" cy="20" r="1.5" fill="currentColor" />
      <circle cx="17" cy="20" r="1.5" fill="currentColor" />
    </svg>
    @if (cart.count()) {
      <span class="navbar__badge">{{ cart.count() > 99 ? '99+' : cart.count() }}</span>
    }
  </a>
</nav>
