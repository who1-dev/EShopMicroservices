# version: '3.8'

services:
  pgadmin:
    container_name: pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in src/.env}
    restart: always
    ports:
      - "127.0.0.1:80:80"
  catalogdb:
    container_name: catalogdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${CATALOGDB_PASSWORD:?set CATALOGDB_PASSWORD in src/.env}
      - POSTGRES_DB=CatalogDb
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data/
  basketdb:
    container_name: basketdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${BASKETDB_PASSWORD:?set BASKETDB_PASSWORD in src/.env}
      - POSTGRES_DB=BasketDb
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql/data/
  distributedcache:
    container_name: distributedcache
    restart: always
    ports:
      - "127.0.0.1:6369:6379"
  orderdb:
    container_name: orderdb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${ORDERDB_SA_PASSWORD:?set ORDERDB_SA_PASSWORD in src/.env}
    restart: always
    ports:
      - "127.0.0.1:1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=$$SA_PASSWORD /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  messagebroker:
    container_name: messagebroker
    hostname: ecommerce-mq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in src/.env}
    restart: always
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
  catalog.api:
    container_name: catalog-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=${CATALOGDB_PASSWORD:?set CATALOGDB_PASSWORD in src/.env};Include Error Detail=true
      - Authentication__Provider=Keycloak
      - Authentication__Authority=http://keycloak:8080/realms/eshop
      - Authentication__Audience=eshop-api
      - Authentication__RequireHttpsMetadata=false
    depends_on:
      - catalogdb
      - keycloak
    ports:
      - "127.0.0.1:6000:8080"
      - "127.0.0.1:6060:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
  basket.api:
    container_name: basket-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=${BASKETDB_PASSWORD:?set BASKETDB_PASSWORD in src/.env};Include Error Detail=true
      - ConnectionStrings__Redis=distributedcache:6379
      - GrpcSettings__DiscountUrl=http://discount.grpc:8080
      - MessageBroker__Host=amqp://ecommerce-mq:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in src/.env}
      - Authentication__Provider=Keycloak
      - Authentication__Authority=http://keycloak:8080/realms/eshop
      - Authentication__Audience=eshop-api
      - Authentication__RequireHttpsMetadata=false
    depends_on:
      - basketdb
      - distributedcache
      - discount.grpc
      - messagebroker
      - keycloak
    ports:
      - "127.0.0.1:6001:8080"
      - "127.0.0.1:6061:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
  discount.grpc:
    container_name: discount-grpc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Data Source=discountdb
    ports:
      - "127.0.0.1:6002:8080"
      - "127.0.0.1:6062:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
  ordering.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=orderdb;Database=OrderDb;User Id=sa;Password=${ORDERDB_SA_PASSWORD:?set ORDERDB_SA_PASSWORD in src/.env};Encrypt=False;TrustServerCertificate=True
      - MessageBroker__Host=amqp://ecommerce-mq:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in src/.env}
      - FeatureManagement__OrderFullfilment=false
      - Authentication__Provider=Keycloak
      - Authentication__Authority=http://keycloak:8080/realms/eshop
      - Authentication__Audience=eshop-api
      - Authentication__RequireHttpsMetadata=false
    depends_on:
      orderdb:
        condition: service_healthy
      messagebroker:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:6003:8080"
      - "127.0.0.1:6063:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
  yarpapigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    depends_on:
      - catalog.api
      - basket.api
      - ordering.api
    ports:
      - "127.0.0.1:6004:8080"
      - "127.0.0.1:6064:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
  keycloak:
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in src/.env}
      - KC_HOSTNAME=http://localhost:8080
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/eshop-realm.json:/opt/keycloak/data/import/eshop-realm.json:ro
      
    